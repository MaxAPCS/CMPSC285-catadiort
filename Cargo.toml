[package]
name = "catadiort"
version = "0.5.0"
edition = "2024"
description = "ECE/CS 285 HW2-HW4: a ray tracer in Rust, driven by the C++ scene files"
build = "build.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["rayon", "png", "jpeg", "bmp", "tga", "hdr"] }
ultraviolet = { version = "0.10", features = ["f64", "bytemuck"] }
wide = "^0.7"
bytemuck = { version = "^1", features = ["derive"] }
rayon = "1"
smallvec = { version = "1", features = ["union", "const_new"] }

[build-dependencies]
cc = "1"

[profile.dev]
opt-level = 1
overflow-checks = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[features]
aovraydir = []
aovnormal = []
aovalbedo = []
aovdepth = []